<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsterkamp – hefte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Andika:wght@400;700&display=swap">
<style>
  :root {
    --ink: #16121c;
    --paper: #ffffff;
    --desk: #d9d4e2;
    --pixel: "Press Start 2P", "Courier New", monospace;
    --soft: "Pixelify Sans", "Trebuchet MS", sans-serif;
    --read: "Andika", "Trebuchet MS", sans-serif;   /* made for beginner readers */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--soft);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- screen toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 16px; background: var(--ink); color: #fff;
    font-family: var(--pixel); font-size: 11px;
  }
  .toolbar button {
    font: inherit; color: var(--ink); background: #fff; border: 0; padding: 8px 10px; cursor: pointer;
    box-shadow: inset -3px -3px 0 #b9b2c6;
  }
  .toolbar button.print { background: #5cc15a; }
  .toolbar button[aria-pressed="true"] { background: #ffd23f; }
  .toolbar button:focus-visible { outline: 3px solid #4dffd8; outline-offset: 2px; }
  .toolbar .hint { font-family: var(--soft); font-size: 14px; opacity: .8; }

  .stack { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px; }

  /* ---------- A4 page ---------- */
  .page {
    width: 210mm; height: 297mm; padding: 10mm 10mm 9mm;
    background: var(--paper);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 24px rgba(22,18,28,.25);
  }
  .page::before {                       /* pixel frame */
    content: ""; position: absolute; inset: 5mm; pointer-events: none;
    box-shadow: 0 -4px 0 var(--theme), 0 4px 0 var(--theme), -4px 0 0 var(--theme), 4px 0 0 var(--theme);
  }

  .head { height: 11mm; display: flex; align-items: center; justify-content: space-between; padding: 0 3mm; }
  .level {
    font-family: var(--pixel); font-size: 12px; color: #fff; background: var(--theme); padding: 7px 10px;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink);
  }
  .name { font-family: var(--pixel); font-size: 17px; letter-spacing: 1px; color: var(--ink); }

  /* battlefield: hero (left) vs monster (right), standing on a pixel ground strip */
  .stage {
    height: 62mm; position: relative; margin: 0 3mm;
    display: grid; grid-template-columns: 1fr auto 1.35fr; align-items: end; padding-bottom: 5mm;
  }
  .stage .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 5mm;
    background:
      linear-gradient(#5cc15a 0 1.6mm, #16121c 1.6mm 2.2mm, transparent 2.2mm),
      repeating-linear-gradient(90deg, #d9b98a 0 6px, #c9a36a 6px 12px);
    box-shadow: 0 -3px 0 #16121c;
  }
  .stage .fighter { display: flex; justify-content: center; position: relative; z-index: 1; }
  .stage svg { width: auto; display: block; }
  .stage svg.hero { height: 36mm; }
  .stage svg.monster { height: 54mm; }
  .page.boss .stage svg.monster { height: 57mm; }
  .stage .vs {
    font-family: var(--pixel); font-size: 26px; color: var(--theme); align-self: center;
    text-shadow: 3px 3px 0 var(--ink);
  }

  /* ---------- level map ---------- */
  .mapwrap { margin: 2mm 3mm 0; position: relative; }
  .mapwrap svg.map { width: 100%; height: 100%; display: block; }
  .map text { font-family: var(--pixel); }
  .howto {
    margin: auto 3mm 2mm; display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: end;
  }
  .howto ol { margin: 0; padding-left: 7mm; font-family: var(--soft); font-weight: 700; font-size: 17px; line-height: 1.35; }
  .howto h2 { font-family: var(--pixel); font-size: 12px; margin: 0 0 2mm; }
  .hero-name { font-family: var(--pixel); font-size: 12px; display: flex; align-items: flex-end; gap: 6px; width: 62mm; }
  .hero-name span { flex: 1; border-bottom: 3px solid var(--ink); height: 10mm; }
  .clear { height: 20mm; flex: none; }   /* the required 2 cm of empty space */

  .hp { height: 20mm; display: flex; align-items: center; justify-content: center; }
  .hp svg { display: block; }
  .hp .heart { height: 20mm; width: auto; position: relative; z-index: 2; margin-right: -4mm; }
  .hp .bar { height: 15mm; width: auto; }
  .bar .seg { cursor: pointer; }
  .bar .seg.hit rect { fill: #ffffff; }

  .cards {
    margin-top: 8mm;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: repeat(3, 41mm);
    gap: 5mm 7mm; padding: 0 3mm;
  }
  .card {
    background: #fff; display: flex; flex-direction: column;
    box-shadow:
      0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
      3px 6px 0 #cfc9d9, 6px 3px 0 #cfc9d9, 6px 6px 0 #cfc9d9;
  }
  .card .tag {
    font-family: var(--pixel); font-size: 10px; letter-spacing: 1px; color: #fff; background: var(--theme);
    padding: 6px 8px 5px; border-bottom: 3px solid var(--ink);
  }
  .card.bonus .tag { background: #ffd23f; color: var(--ink); }
  .card .q {
    font-family: var(--pixel); font-size: 17px; line-height: 1.3; padding: 4mm 3mm 0;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; white-space: nowrap;
  }
  .card .q.long { font-size: 14px; }
  /* difficulty sets: pizza decimals, tips, long problems */
  .pizzas { display: flex; align-items: flex-end; gap: 4px; padding: 1.5mm 4mm 0; flex-wrap: wrap; }
  .pizzas .bn { display: flex; gap: 1px; }
  .pizzas svg { height: 18px; width: auto; display: block; }
  .pizzas .op { font-family: var(--pixel); font-size: 11px; padding: 0 2px; }
  .card .tip { margin: 1.5mm 4mm 0; font-family: var(--soft); font-weight: 700; font-size: 14px; color: #6a6078; }
  .card .q.xlong { font-size: 12.5px; }
  .gems { flex-wrap: wrap; }
  .gems .op { font-family: var(--pixel); font-size: 12px; }
  .page.blodio .card .q.long { font-size: 13px; } .page.blodio .card .q.xlong { font-size: 11.5px; }
  .box { display: inline-block; min-width: 1.4em; text-align: center; border: 3px solid var(--ink); padding: 2px 3px; }
  .num { font-family: var(--pixel); font-size: .8em; }
  .card .q.words { font-family: var(--soft); font-weight: 700; font-size: 24px; }
  .gems { display: flex; gap: 7px; padding: 1.5mm 3mm 0; align-items: center; }
  .gems .grp { display: flex; gap: 2px; padding: 2px 3px; box-shadow: 0 0 0 2px #9d95ab; }
  .gems svg { height: 12px; width: auto; display: block; }
  .ans {
    margin: auto 3mm 3mm; height: 12mm; display: flex; align-items: flex-end; gap: 6px;
    font-family: var(--soft); font-weight: 700; font-size: 18px; color: #5b5468;
  }
  .ans span.line { flex: 1; height: 0; border-bottom: 3px dashed #9d95ab; margin-bottom: 4px; }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-family: var(--pixel); font-size: 14px; line-height: 1; vertical-align: middle; }
  .frac b { font-weight: 400; padding: 0 2px 3px; border-bottom: 3px solid var(--ink); }
  .frac i { font-style: normal; padding-top: 3px; }

  .foot { margin-top: auto; display: flex; align-items: center; gap: 6mm; padding: 0 3mm 2mm; }
  .badge {
    font-family: var(--pixel); font-size: 15px; color: #fff; background: var(--ink); padding: 10px 12px;
    box-shadow: 0 -3px 0 var(--theme), 0 3px 0 var(--theme), -3px 0 0 var(--theme), 3px 0 0 var(--theme);
    white-space: nowrap;
  }
  .foot p { margin: 0; font-family: var(--soft); font-weight: 700; font-size: 20px; line-height: 1.2; }
  .foot p small { display: block; font-weight: 500; font-size: 14px; color: #5b5468; margin-top: 2px; }


  /* ---------- story / cover page ---------- */
  .cover .title { text-align: center; margin: 0; }
  .cover .title h1 { font-family: var(--pixel); font-size: 26px; line-height: 1.35; margin: 0; letter-spacing: 1px; }
  .cover .title h1 em { font-style: normal; color: #e0452a; }
  .cover .title p { font-family: var(--pixel); font-size: 9px; color: #5b5468; margin: 2mm 0 0; }
  .cover .stage { height: 58mm; margin-top: 1mm; grid-template-columns: 1fr auto 1.7fr; }
  .cover .stage svg.hero { height: 36mm; }
  .villain { display: flex; align-items: flex-end; justify-content: center; gap: 3mm; position: relative; z-index: 1; }
  .villain svg.blodio { height: 50mm; width: auto; display: block; }
  .cage { position: relative; padding: 2mm 2mm 0; }
  .cage svg { height: 30mm; width: auto; display: block; }
  .cage::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0 4.2mm, #16121c 4.2mm 5.2mm);
    box-shadow: inset 0 3px 0 #16121c, inset 3px 0 0 #16121c, inset -3px 0 0 #16121c;
  }
  .cage-label { position: absolute; top: -9mm; left: 50%; transform: translateX(-50%); font-family: var(--pixel); font-size: 10px;
    background: #fff; padding: 5px 7px; white-space: nowrap;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }
  .story { margin: 5mm 5mm 0; font-family: var(--read); font-size: 18px; line-height: 1.45; display: grid; gap: 4mm; }
  .story p { margin: 0; }
  .story .me {                           /* lines the child reads aloud */
    display: flex; align-items: center; gap: 4mm; font-size: 25px; font-weight: 700; letter-spacing: 1.5px; line-height: 1.2;
    padding: 2mm 4mm; background: #fff7d6;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink);
  }
  .story .me svg { height: 7mm; width: auto; flex: none; }
  .story .me small { margin-left: auto; font-family: var(--pixel); font-size: 8px; letter-spacing: 0; color: #5b5468; font-weight: 400; }
  .quiz { margin: auto 5mm 2mm; display: grid; gap: 3mm; }
  .quiz h2 { font-family: var(--pixel); font-size: 11px; margin: 0 0 1mm; }
  .quiz div { font-family: var(--read); font-weight: 700; font-size: 19px; letter-spacing: 1px; display: flex; align-items: flex-end; gap: 4mm; }
  .quiz div span { flex: 1; border-bottom: 3px dashed #9d95ab; height: 8mm; }


  /* ---------- final battle: Blodio (10 lives, 11 cards) ---------- */
  .page.blodio .stage { height: 47mm; margin-top: 6mm; grid-template-columns: 1fr auto 1.7fr; }
  .page.blodio .stage svg.hero { height: 32mm; }
  .page.blodio .villain svg.blodio { height: 44mm; }
  .page.blodio .cage svg { height: 24mm; }
  .page.blodio .clear { height: 9mm; }
  .page.blodio .hp { height: 14mm; }
  .page.blodio .hp .heart { height: 15mm; margin-right: -3mm; }
  .page.blodio .hp .bar { height: 11mm; }
  .page.blodio .cards { margin-top: 5mm; grid-template-rows: repeat(6, 24.5mm); gap: 3mm 7mm; }
  .page.blodio .card .tag { font-size: 9px; padding: 4px 8px 3px; }
  .page.blodio .card .q { font-size: 15px; padding: 2mm 3mm 0; }
  .page.blodio .card .q.words { font-size: 17px; flex-wrap: nowrap; }
  .page.blodio .gems svg { height: 9px; }
  .page.blodio .gems { gap: 4px; }
  .page.blodio .card .q .gems { padding: 0 0 0 2mm; }
  .page.blodio .ans { height: 8mm; margin-bottom: 2mm; font-size: 16px; }
  .page.blodio .card.super .tag { background: #ffd23f; color: var(--ink); }
  .page.blodio .card.win { justify-content: center; align-items: center; text-align: center; gap: 2mm; background: #fff7d6; }
  .page.blodio .card.win b { font-family: var(--pixel); font-size: 12px; font-weight: 400; }
  .page.blodio .card.win span { font-family: var(--soft); font-weight: 700; font-size: 15px; color: #5b5468; padding: 0 4mm; }
  .page.blodio .foot { padding-bottom: 0; }
  .taunt {
    position: absolute; top: -5mm; left: 0; z-index: 3;
    font-family: var(--pixel); font-size: 10px; background: #fff; padding: 6px 8px; white-space: nowrap;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink);
  }

  /* ---------- answer key ---------- */
  .key h1 { font-family: var(--pixel); font-size: 20px; margin: 4mm 3mm 2mm; }
  .key > p { font-family: var(--soft); font-size: 15px; margin: 0 3mm 6mm; color: #5b5468; }
  .key table { border-collapse: collapse; margin: 0 3mm; width: calc(100% - 6mm); font-family: var(--soft); font-size: 15px; }
  .key th { text-align: left; font-family: var(--pixel); font-size: 10px; padding: 8px 6px; background: var(--ink); color: #fff; }
  .key td { padding: 6px; border-bottom: 2px solid #e4e0ea; white-space: nowrap; }
  .key td.lvl { font-family: var(--pixel); font-size: 10px; }
  .key td b { font-family: var(--pixel); font-weight: 400; font-size: 11px; }

  @media screen and (max-width: 860px) {
    .page { zoom: calc((100vw - 32px) / 210mm); }
  }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .toolbar { display: none; }
    .stack { padding: 0; gap: 0; display: block; }
    .page { box-shadow: none; zoom: 1; page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>

/* ---------- pixel sprite renderer ---------------------------------------
   Rows are strings, one char per pixel ('.' = empty). With mirror:true the
   rows are the left half and get mirrored. A 1‑pixel dark outline is added
   automatically around every filled shape. */
const OUT = '#16121c';
function sprite(rows, pal, { mirror = false } = {}) {
  let g = rows.map(r => mirror ? r + [...r].reverse().join('') : r);
  const w = Math.max(...g.map(r => r.length)) + 2;
  g = ['', ...g, ''].map(r => ('.' + r).padEnd(w, '.').split(''));
  const h = g.length;
  const filled = (y, x) => y >= 0 && y < h && x >= 0 && x < w && g[y][x] !== '.' && g[y][x] !== '#';
  const out = g.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (g[y][x] === '.' && (filled(y-1,x) || filled(y+1,x) || filled(y,x-1) || filled(y,x+1))) out[y][x] = '#';
  let rects = '';
  for (let y = 0; y < h; y++) {
    let x = 0;
    while (x < w) {
      const c = out[y][x];
      if (c === '.') { x++; continue; }
      let e = x; while (e + 1 < w && out[y][e + 1] === c) e++;
      const fill = c === '#' || c === 'K' ? OUT : pal[c];
      if (!fill) console.warn('missing colour', c);
      rects += `<rect x="${x}" y="${y}" width="${e - x + 1}" height="1" fill="${fill}"/>`;
      x = e + 1;
    }
  }
  return { w, h, body: rects };
}

function pond(w, h) {
  const rows = [];
  for (let y = 0; y < h; y++) {
    let r = '';
    for (let x = 0; x < w; x++) {
      const dx = (x + .5 - w / 2) / (w / 2), dy = (y + .5 - h / 2) / (h / 2);
      r += dx * dx + dy * dy <= 1 ? (y === 1 && x > w * .25 && x < w * .45 ? 'l' : 'w') : '.';
    }
    rows.push(r);
  }
  return sprite(rows, { w:'#7fd0f2', l:'#e8f8ff' });
}
function darken(hex, f = .6) {
  const n = parseInt(hex.slice(1), 16), c = s => Math.round(((n >> s) & 255) * f);
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}
const platform = color => sprite(["..gggggggggg..", "gggggggggggggg", "..GGGGGGGGGG.."], { g: color, G: darken(color) });

// Place a sprite inside the map SVG (mm units): centred on cx, feet on `bottom`.
function place(s, cx, bottom, height) {
  const w = height * s.w / s.h;
  return `<svg x="${cx - w / 2}" y="${bottom - height}" width="${w}" height="${height}" viewBox="0 0 ${s.w} ${s.h}" shape-rendering="crispEdges">${s.body}</svg>`;
}

/* ---------- 5-segment health bar ---------- */
function healthBar(n = 5, S = 15) {
  const W = 1 + n * (S + 1), H = 11;
  let r = `<rect x="0" y="1" width="${W}" height="9" fill="${OUT}"/><rect x="1" y="0" width="${W - 2}" height="11" fill="${OUT}"/>`;
  for (let i = 0; i < n; i++) {
    const x = 1 + i * (S + 1);
    r += `<g class="seg" data-i="${i}">` +
      `<rect x="${x}" y="1" width="${S}" height="2" fill="#86e27f"/>` +
      `<rect x="${x}" y="3" width="${S}" height="4" fill="#34b544"/>` +
      `<rect x="${x}" y="7" width="${S}" height="3" fill="#1f8a33"/>` +
      `<rect x="${x + 1}" y="2" width="3" height="1" fill="#e9ffe4"/></g>`;
  }
  // rounded pixel corners
  for (const [x, y] of [[1,1],[1,9],[W-2,1],[W-2,9]]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${OUT}"/>`;
  return `<svg class="bar" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
}

const tb = document.getElementById('toolbar');
const views = [['alle', 'ALLE'], ['historie', 'HISTORIE'], ['kart', 'KART'], ...LEVELS.map((_, i) => [String(i + 1), 'KAMP ' + (i + 1)]), ['blodio', 'BLODIO'], ['fasit', 'FASIT']];
tb.innerHTML = views.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${v === 'alle'}">${t}</button>`).join('') +
  `<button type="button" id="printbtn" class="print">SKRIV UT / LAGRE SOM PDF</button>` +
  `<span class="hint">Velg «Lagre som PDF» i utskriftsvinduet, eller skriv ut direkte på A4.</span>`;
tb.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.v) return;
  tb.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.querySelectorAll('.page').forEach(p => { p.hidden = !(b.dataset.v === 'alle' || p.dataset.page === b.dataset.v); });
});
// Open one sheet directly with #kart, #1 … #5 or #fasit.
document.getElementById('printbtn').addEventListener('click', () => window.print());
const start = tb.querySelector(`button[data-v="${location.hash.slice(1)}"]`);
if (start) start.click();
</script>
</body>
</html>
