<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gratis mattehefter i pikselstil for barn 6–10 år. Velg spill og nivå, last ned og skriv ut.">
<meta property="og:title" content="Mattematika">
<meta property="og:description" content="Gratis mattehefter i pikselstil. Barnet slår monstre eller redder dyr med matte.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 9' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff6fb0' d='M1 0h3v1h1v1h1V1h1V0h3v1h1v3h-1v1H9v1H8v1H7v1H6v1H5V8H4V7H3V6H2V5H1V4H0V1h1z'/%3E%3C/svg%3E">
<title>Mattematika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: a clean white page, one choice per screen — game → level → the land's map + download. Pixel type only for names and buttons. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #16121c;
    --muted: #6b6577;
    --line: #ece8f3;
    --card: #f6f3fb;
    --gold: #ffd23f;
    --gold-dark: #e2b21a;
    --pixel: "Press Start 2P", "Courier New", monospace;
    --body: "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5; }
  a { color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 56px; }

  .bar { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
  .brand { font-family: var(--pixel); font-size: 16px; letter-spacing: 1px; text-decoration: none; text-shadow: 2px 2px 0 var(--gold); }

  .btn {
    font-family: var(--pixel); font-size: 12px; letter-spacing: .5px; color: var(--ink); background: var(--gold);
    padding: 15px 18px; border: 0; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 0 0 3px var(--ink), inset -4px -4px 0 var(--gold-dark);
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { box-shadow: 0 0 0 3px var(--ink), inset 4px 4px 0 var(--gold-dark); }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #ff6fb0; outline-offset: 6px; }
  .back { font-family: var(--pixel); font-size: 10px; color: var(--muted); text-decoration: none; display: inline-block; margin-top: 18px; }
  .back:hover { color: var(--ink); }

  /* 1) home */
  .home { text-align: center; padding-top: 7vh; }
  .logo { font-family: var(--pixel); font-weight: 400; font-size: clamp(30px, 6.4vw, 60px); letter-spacing: 2px; margin: 0;
    text-shadow: 4px 4px 0 var(--gold); }
  .tagline { margin: 18px auto 0; max-width: 34ch; color: var(--muted); font-size: 19px; text-wrap: balance; }
  .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; margin-top: 64px; }
  .game { display: flex; flex-direction: column; align-items: center; gap: 30px; text-decoration: none; padding: 8px 0 12px; }
  .game .art { height: 170px; display: flex; align-items: flex-end; justify-content: center; }
  .game .art svg { display: block; width: auto; max-width: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .game .art svg { transition: transform .15s steps(2); }
    .game:hover .art svg { transform: translateY(-6px); }
  }
  .home .small { margin-top: 64px; font-family: var(--pixel); font-size: 9px; color: var(--muted); letter-spacing: 1px; }

  /* 2) level */
  .mascot { display: flex; justify-content: center; margin-top: 18px; }
  .mascot .fig { position: relative; }
  .mascot svg { display: block; width: auto; }
  .speech { position: absolute; left: calc(100% + 8px); top: 6px; white-space: nowrap; font-family: var(--pixel); font-size: 13px; background: #fff; padding: 12px 16px;
    box-shadow: 0 0 0 3px var(--ink); }
  .speech::before { content: ""; position: absolute; left: -9px; bottom: 6px; width: 6px; height: 6px; background: var(--ink);
    box-shadow: 3px -3px 0 var(--ink); }
  .pick { font-family: var(--pixel); font-weight: 400; font-size: 14px; text-align: center; margin: 22px 0 26px; color: var(--muted); }
  .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
  .level { display: flex; flex-direction: column; text-decoration: none; background: var(--card); box-shadow: 0 0 0 3px var(--ink), 6px 7px 0 var(--line); }
  @media (prefers-reduced-motion: no-preference) { .level { transition: transform .12s steps(2); } .level:hover { transform: translateY(-4px); } }
  .level header { padding: 13px 14px; color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); }
  .level header b { font-family: var(--pixel); font-weight: 400; font-size: 11px; }
  .level .meter { display: flex; gap: 3px; }
  .level .meter i { width: 9px; height: 13px; background: rgba(0,0,0,.25); box-shadow: 0 0 0 2px var(--ink); }
  .level .meter i.on { background: var(--gold); }
  .lv-body { padding: 16px 14px; display: grid; gap: 12px; flex: 1; align-content: start; }
  .lv-body h3 { font-family: var(--pixel); font-weight: 400; font-size: 12px; margin: 0; }
  .lv-body p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.4; }
  .attack { background: #fff; box-shadow: 0 0 0 3px var(--ink); }
  .attack .t { font-family: var(--pixel); font-size: 8px; color: #fff; background: var(--ink); padding: 4px 7px; }
  .attack .q { font-family: var(--pixel); font-size: 15px; padding: 10px 10px 12px; white-space: nowrap; overflow-x: auto; }
  .attack .q.small { font-size: 11px; }
  .attack .pic { display: flex; gap: 6px; padding: 0 10px 10px; align-items: center; flex-wrap: wrap; font-family: var(--pixel); font-size: 10px; }
  .attack .pic span { display: flex; gap: 2px; padding: 2px 3px; box-shadow: 0 0 0 2px #c9a9d8; }
  .attack .pic svg { height: 11px; width: auto; display: block; }
  .grade { font-family: var(--pixel); font-size: 9px; color: var(--muted); padding: 0 14px 16px; }

  /* 3) the land + download */
  .dl-head { text-align: center; margin: 26px 0 22px; }
  .eyebrow { font-family: var(--pixel); font-size: 10px; letter-spacing: 1px; }
  .dl-head h2 { font-family: var(--pixel); font-weight: 400; font-size: clamp(20px, 3.4vw, 28px); margin: 12px 0 10px; text-wrap: balance; }
  .dl-head p { margin: 0; color: var(--muted); }
  .land { max-width: 560px; margin: 0 auto; }
  .kart { box-shadow: 0 0 0 3px var(--ink); background: #eef7e4; min-height: 200px; }
  .kart svg { display: block; width: 100%; height: auto; }
  .kart svg text:not([fill]):not([style]) { fill: var(--ink); }
  .kart svg text { font-family: var(--pixel); }
  .land .btn { width: 100%; margin-top: 22px; font-size: 13px; padding: 18px; }
  .status { min-height: 1.5em; margin: 12px 0 0; text-align: center; color: var(--muted); font-size: 16px; }
  .status.ok { color: #1f7a33; } .status.err { color: #c8232c; }

  footer { margin-top: 64px; padding-top: 18px; border-top: 3px solid var(--line); text-align: center; color: var(--muted); font-size: 15px; }

  @media (max-width: 760px) {
    .games, .levels { grid-template-columns: minmax(0, 1fr); }
    .games { gap: 40px; margin-top: 44px; }
    .game .art { height: 140px; }
  }
</style>

<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="view"></main>
  <footer>Mattehefter til utskrift · 6–10 år · A4</footer>
</div>

<script>
/* ---------- tiny pixel sprite renderer (same as in the booklets) ---------- */
const OUT = '#16121c';
function sprite(rows, pal, { mirror = false } = {}) {
  let g = rows.map(r => mirror ? r + [...r].reverse().join('') : r);
  const w = Math.max(...g.map(r => r.length)) + 2;
  g = ['', ...g, ''].map(r => ('.' + r).padEnd(w, '.').split(''));
  const h = g.length, filled = (y, x) => y >= 0 && y < h && x >= 0 && x < w && g[y][x] !== '.';
  const out = g.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (g[y][x] === '.' && (filled(y - 1, x) || filled(y + 1, x) || filled(y, x - 1) || filled(y, x + 1))) out[y][x] = '#';
  let rects = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w;) {
    const c = out[y][x]; if (c === '.') { x++; continue; }
    let e = x; while (e + 1 < w && out[y][e + 1] === c) e++;
    rects += `<rect x="${x}" y="${y}" width="${e - x + 1}" height="1" fill="${c === '#' || c === 'K' ? OUT : pal[c]}"/>`;
    x = e + 1;
  }
  return (h2, label = '') => `<svg viewBox="0 0 ${w} ${h}" style="height:${h2}" shape-rendering="crispEdges" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

const LAVA = sprite(["H............", "HH...........", "hHH.........F", ".hHH.......FY", "..hHH..rrrrrr", "...hHrrrrrrrr", ".F..rrrrrrrrr", "FYF.rrKKrrrrr",
  "FYFrrrrEKKrrr", "rrrrrrEEEEKrr", "rRrrKrEEKKEOr", "rRrRKrEEKKEOr", "rRrRKrrEEErOr", "rRrrKrKKKKKKK", "rrrrKKWWMWWMW", "RrrrKKMWMMWMM", "rrrrKKMMMMMMM",
  "rrrr.KMMWMMMW", "WKWKWKMWWMMWW", "W.W.WrKKKKKKK", "....rrOrrrrOr", "....rrrOOrrrO", "....rrrrrrrrr", "....RRRR.....", "...RRRRR....."],
  { r:'#a8301f', R:'#6c160f', O:'#ff9a1f', Y:'#ffe14a', F:'#ff5a14', H:'#f3e3b6', h:'#b89c63', E:'#ffe14a', W:'#ffffff', M:'#3a0a0a' }, { mirror: true });
const BUNNY = sprite(["...ww....", "..wppw...", "..wppw...", "..wppw...", "..wppw...", "...ww....", "..wwwwwww", ".wwwwwwww", "wwwwwwwww", "wwWEEwwww",
  "wwEEEwwww", "wwEEEwwww", "wppwwwwwn", "wwwwwwwKw", ".wwwwwwwK", "..wwwwwww", "...cwwbbb", "..wcwwbbb", "...cwwbbb", "..www...."],
  { w:'#f4eefa', c:'#d9cde8', p:'#ffb3d1', n:'#ff6fa8', b:'#ffffff', E:'#2a1a3a', W:'#ffffff' }, { mirror: true });
const HEART = sprite([".RRR...RRR.", "RWWRR.RRRRR", "RWRRRRRRRRD", "RRRRRRRRRRD", ".RRRRRRRRD.", "..RRRRRRD..", "...RRRRD...", "....RRD....", ".....D....."],
  { R:'#ff6fb0', W:'#ffffff', D:'#e0408a' });
const MINI = sprite([".RRR...RRR.", "RRRRR.RRRRR", "RRRRRRRRRRR", "RRRRRRRRRRR", ".RRRRRRRRR.", "..RRRRRRR..", "...RRRRR...", "....RRR....", ".....R....."], { R:'#ff6fb0' });
const PIZZA = sprite([".ccc.", "cyryc", "cyyyc", "cryrc", ".ccc."], { c:'#e8a54b', y:'#ffd23f', r:'#d63a2a' });
const HALFPIZZA = sprite([".cc", "cyr", "cyy", "cry", ".cc"], { c:'#e8a54b', y:'#ffd23f', r:'#d63a2a' });

/* ---------- content ---------- */
const GAMES = {
  monsterkamp: { title: 'Monsterkamp', mascot: () => LAVA('150px', 'Lavamonsteret'), art: () => LAVA('160px', 'Lavamonsteret'), say: 'GRRR!',
    color: '#e0452a', land: 'Monsterskogen', hero: 'Max', defFigur: 'helt', defClothes: '1fa8a0',
    about: '9 sider: historie, kart, fem kamper, sluttkamp mot Blodio og fasit.',
    extras: [['venn', 'Prinsessen som skal reddes', 'Nogi'], ['skurk', 'Skurken', 'Blodio']] },
  dyreredning: { title: 'Dyreredning', mascot: () => BUNNY('130px', 'Kaninen'), art: () => BUNNY('120px', 'Kaninen'), say: 'Jippi!',
    color: '#ff6fb0', land: 'Blomsterdalen', hero: 'Mira', defFigur: 'prinsesse', defClothes: 'ff8fc2',
    about: '9 sider: historie, kart, fem dyr å redde, slottet med diplom og fasit.',
    extras: [['dyr', 'Kaninen heter', 'Pip']] },
};
const plus = (a, b) => `<div class="pic"><span>${MINI('11px').repeat(a)}</span>+<span>${MINI('11px').repeat(b)}</span></div>`;
const pizzas = () => `<div class="pic">${PIZZA('14px').repeat(2)}${HALFPIZZA('14px')}+${PIZZA('14px').repeat(2)}${HALFPIZZA('14px')}</div>`;
const LEVELS = [
  { n: 1, name: 'LETT', color: '#3fae6a', grade: 'Ca. 1. trinn', text: 'Pluss og minus opp til 10, med bilder å telle på. Ingen ganging.',
    ex: [['ANGREP', '3 + 4 ='], ['ANGREP', '9 - 5 ='], ['BONUS', '3 + 2 =', plus(3, 2)]] },
  { n: 2, name: 'MIDDELS', color: '#e8a400', grade: 'Ca. 2.–3. trinn', text: 'Opp til 100 med tierovergang. Ganging med bilder og enkle parenteser.',
    ex: [['ANGREP', '47 + 18 ='], ['ANGREP', '83 - 29 ='], ['ANGREP', '(4 + 6) · 2 =']] },
  { n: 3, name: 'UTFORDRENDE', color: '#e0452a', grade: 'Ca. 3.–5. trinn', text: 'Over 100, minustall, doble parenteser og en første smak på kommatall.',
    ex: [['ANGREP', '175 + 48 ='], ['ANGREP', '4 - 13 ='], ['ANGREP', '((6 + 4) · 3) - 5 ='], ['BONUS', '2,5 + 2,5 =', pizzas()]] },
];

/* ---------- views ---------- */
const view = document.getElementById('view'), bar = document.getElementById('bar');

function home() {
  bar.innerHTML = '';
  view.innerHTML = `
    <section class="home">
      <h1 class="logo">MATTEMATIKA</h1>
      <p class="tagline">Lær deg å slåss mot monstre eller redde dyr med matte, med penn og papir.</p>
      <div class="games">
        ${Object.entries(GAMES).map(([key, G]) => `
          <a class="game" href="#${key}"><span class="art">${G.art()}</span><span class="btn">VELG ${G.title.toUpperCase()} &gt;</span></a>`).join('')}
      </div>
    </section>`;
}

function levels(key) {
  const G = GAMES[key];
  view.innerHTML = `
    <a class="back" href="#">&lt; TILBAKE</a>
    <div class="mascot"><div class="fig">${G.mascot()}<span class="speech">${G.say}</span></div></div>
    <h2 class="pick">VELG NIVÅ</h2>
    <div class="levels">
      ${LEVELS.map(L => `
        <a class="level" href="#${key}-${L.n}">
          <header style="background:${L.color}"><b>NIVÅ ${L.n}</b><span class="meter">${[1, 2, 3].map(k => `<i class="${k <= L.n ? 'on' : ''}"></i>`).join('')}</span></header>
          <div class="lv-body">
            <h3>${L.name}</h3>
            <p>${L.text}</p>
            ${L.ex.map(([t, q, pic = '']) => `<div class="attack"><div class="t">${t}</div><div class="q${q.length > 14 ? ' small' : ''}">${q}</div>${pic}</div>`).join('')}
          </div>
          <div class="grade">${L.grade}</div>
        </a>`).join('')}
    </div>`;
}

const maps = {};
async function loadMap(key, el) {
  try {
    maps[key] = maps[key] || await fetch(`kart/${key}.svg`).then(r => { if (!r.ok) throw 0; return r.text(); });
    el.innerHTML = maps[key];
  } catch { el.hidden = true; }
}

function download(key, n) {
  const G = GAMES[key], L = LEVELS[n - 1];
  const file = `${key}-verden1-niva${n}.pdf`, nice = `Mattematika - ${G.title} - Nivå ${n}.pdf`;
  view.innerHTML = `
    <a class="back" href="#${key}">&lt; VELG ET ANNET NIVÅ</a>
    <div class="dl-head">
      <div class="eyebrow" style="color:${G.color}">${G.title.toUpperCase()} · NIVÅ ${n} ${L.name}</div>
      <h2>${G.land}</h2>
    </div>
    <div class="land">
      <div class="kart" id="kart" role="img" aria-label="Kart over ${G.land}"></div>
      <button class="btn" type="button" id="dlbtn">LAST NED PDF &gt;</button>
      <p class="status" id="status" role="status"></p>
    </div>`;
  loadMap(key, document.getElementById('kart'));
  document.getElementById('dlbtn').addEventListener('click', () => save(file, nice));
}

async function save(file, nice) {
  const status = document.getElementById('status');
  const say = (t, cls = '') => { status.textContent = t; status.className = 'status ' + cls; };
  try {
    if (!window.claude) {             // an ordinary website: a plain download link
      const a = document.createElement('a');
      a.href = 'pdf/' + file; a.download = nice; document.body.appendChild(a); a.click(); a.remove();
      say('Nedlastingen starter. Åpne PDF-en og skriv ut.', 'ok'); return;
    }
    say('Henter heftet …');
    const dl = await window.claude.use('downloads');
    if (!dl) { say('Nedlasting virker ikke i denne visningen. Åpne siden i en vanlig nettleser.', 'err'); return; }
    const res = await fetch('pdf/' + file);
    if (!res.ok) throw { code: 'missing' };
    await dl.save({ filename: nice, data: await res.blob() });
    say('Lagret! Åpne PDF-en og skriv ut.', 'ok');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') say('Nedlastingen ble avbrutt. Trykk på knappen igjen når du er klar.');
    else if (code === 'rate_limited') say('Et lagringsvindu er allerede åpent. Fullfør det først.');
    else say('Noe gikk galt med nedlastingen. Last siden på nytt og prøv igjen.', 'err');
  }
}

/* ---------- routing with bare #tokens ---------- */
function render() {
  const m = location.hash.slice(1).match(/^(monsterkamp|dyreredning)(?:-([123]))?$/);
  if (m) bar.innerHTML = `<a class="brand" href="#">MATTEMATIKA</a>`;
  if (m && m[2]) download(m[1], +m[2]);
  else if (m) levels(m[1]);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>

</html>
