<style>
  /* Layout: a night-sky arcade cabinet. One screen at a time: choose adventure → choose level → world 1 with the download. */
  :root {
    color-scheme: dark;
    --night: #17123a;
    --night-2: #231b56;
    --panel: #f6f2ff;
    --panel-2: #e9e2fb;
    --ink: #16121c;
    --muted: #5b5468;
    --star: #fff6c9;
    --gold: #ffd23f;
    --red: #e0452a;
    --pink: #ff6fb0;
    --teal: #1fa8a0;
    --grass: #5cc15a;
    --text-on-night: #f6f2ff;
    --soft-on-night: #b9b0de;
    --pixel: "Press Start 2P", "Courier New", monospace;
    --body: "Pixelify Sans", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--text-on-night); font-family: var(--body); font-size: 18px; line-height: 1.45;
    background-image:
      radial-gradient(circle at 20% 0%, var(--night-2) 0, transparent 55%),
      radial-gradient(circle at 90% 30%, var(--night-2) 0, transparent 45%);
  }
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sky i { position: absolute; width: 3px; height: 3px; background: var(--star); box-shadow: 0 0 0 1px rgba(255,246,201,.15); }
  @media (prefers-reduced-motion: no-preference) { .sky i:nth-child(3n) { animation: twinkle 2.4s steps(2) infinite; } }
  @keyframes twinkle { 50% { opacity: .2; } }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { font-family: var(--pixel); font-size: 14px; letter-spacing: 1px; color: var(--gold); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .brand svg { height: 26px; width: auto; }
  .free { font-family: var(--pixel); font-size: 10px; color: var(--ink); background: var(--grass); padding: 7px 10px;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }

  h1, h2, h3 { font-family: var(--pixel); font-weight: 400; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(22px, 4.6vw, 44px); line-height: 1.35; letter-spacing: 1px; }
  h1 em { font-style: normal; color: var(--gold); }
  h2 { font-size: clamp(16px, 2.4vw, 22px); line-height: 1.45; }
  h3 { font-size: 13px; line-height: 1.5; }
  .lead { color: var(--soft-on-night); max-width: 60ch; margin: 16px 0 0; font-size: 20px; }
  .eyebrow { font-family: var(--pixel); font-size: 10px; letter-spacing: 2px; color: var(--pink); margin-bottom: 14px; }

  /* pixel frame */
  .px { box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 8px 10px 0 rgba(0,0,0,.35); }
  .btn {
    font-family: var(--pixel); font-size: 11px; letter-spacing: 1px; color: var(--ink); background: var(--gold); border: 0; cursor: pointer;
    padding: 14px 16px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), inset -4px -4px 0 rgba(0,0,0,.18);
  }
  .btn:hover { filter: brightness(1.06); transform: translate(0, -1px); }
  .btn:active { transform: translate(0, 2px); box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), inset 4px 4px 0 rgba(0,0,0,.18); }
  .btn:focus-visible, .choice:focus-visible, .level:focus-visible, .back:focus-visible { outline: 3px solid var(--pink); outline-offset: 6px; }
  .back { font-family: var(--pixel); font-size: 10px; color: var(--soft-on-night); background: none; border: 0; cursor: pointer; padding: 6px 0; margin-bottom: 18px; }
  .back:hover { color: var(--gold); }

  /* step 1: the two adventures */
  .hero { margin-bottom: 34px; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
  .choice {
    text-align: left; border: 0; cursor: pointer; padding: 0; background: var(--panel); color: var(--ink); font: inherit;
    display: flex; flex-direction: column; transition: transform .12s steps(2);
  }
  .choice:hover { transform: translate(0, -4px); }
  .scene { height: 210px; position: relative; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 18px 20px; overflow: hidden; }
  .scene.elliot { background: linear-gradient(#bfe6ff 0 70%, transparent 70%), #fff; }
  .scene.yuna { background: linear-gradient(#ffe0ef 0 70%, transparent 70%), #fff; }
  .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 20px;
    background: linear-gradient(#5cc15a 0 6px, #16121c 6px 9px, transparent 9px), repeating-linear-gradient(90deg, #d9b98a 0 8px, #c9a36a 8px 16px); }
  .scene.yuna::after { background: linear-gradient(#8ee0a8 0 6px, #16121c 6px 9px, transparent 9px), repeating-linear-gradient(90deg, #ffe0ef 0 8px, #ffc9e1 8px 16px); }
  .scene svg { position: relative; z-index: 1; width: auto; display: block; }
  .scene .vs { position: relative; z-index: 1; align-self: center; font-family: var(--pixel); font-size: 20px; color: var(--red); text-shadow: 3px 3px 0 var(--ink); }
  .choice-body { padding: 20px 22px 24px; display: grid; gap: 10px; border-top: 4px solid var(--ink); }
  .choice-body p { margin: 0; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .tag { font-family: var(--pixel); font-size: 9px; padding: 6px 8px; background: var(--panel-2); color: var(--ink); }
  .choice .go { margin-top: 8px; justify-self: start; }

  .how { margin-top: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .how div { padding: 18px; background: rgba(255,255,255,.04); box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
  .how b { display: block; font-family: var(--pixel); font-weight: 400; font-size: 10px; color: var(--gold); margin-bottom: 8px; }
  .how p { margin: 0; color: var(--soft-on-night); font-size: 17px; }

  /* step 2: worlds and levels */
  .worlds { display: flex; gap: 14px; flex-wrap: wrap; margin: 24px 0 36px; }
  .world { padding: 12px 14px; font-family: var(--pixel); font-size: 10px; line-height: 1.6; background: rgba(255,255,255,.05); color: var(--soft-on-night);
    box-shadow: 0 0 0 3px rgba(255,255,255,.14); }
  .world.open { background: var(--gold); color: var(--ink); box-shadow: 0 0 0 3px var(--ink); }
  .world small { display: block; font-family: var(--body); font-size: 15px; letter-spacing: 0; }
  .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 22px; }
  .level { text-align: left; border: 0; cursor: pointer; padding: 0; font: inherit; background: var(--panel); color: var(--ink); display: flex; flex-direction: column; transition: transform .12s steps(2); }
  .level:hover { transform: translate(0, -4px); }
  .level header { padding: 14px 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--ink); }
  .level header b { font-family: var(--pixel); font-weight: 400; font-size: 12px; }
  .level header span { font-family: var(--pixel); font-size: 9px; }
  .level .meter { display: flex; gap: 4px; }
  .level .meter i { width: 10px; height: 14px; background: rgba(0,0,0,.28); box-shadow: 0 0 0 2px var(--ink); }
  .level .meter i.on { background: var(--gold); }
  .lv-body { padding: 16px; display: grid; gap: 12px; flex: 1; }
  .lv-body p { margin: 0; color: var(--muted); font-size: 16px; }
  .attack { background: #fff; box-shadow: 0 0 0 3px var(--ink); }
  .attack .t { font-family: var(--pixel); font-size: 8px; color: #fff; background: var(--ink); padding: 4px 7px; }
  .attack .q { font-family: var(--pixel); font-size: 15px; padding: 10px 10px 12px; white-space: nowrap; overflow-x: auto; }
  .attack .q.small { font-size: 11px; }
  .attack .pic { display: flex; gap: 6px; padding: 0 10px 10px; align-items: center; flex-wrap: wrap; }
  .attack .pic span { display: flex; gap: 2px; padding: 2px 3px; box-shadow: 0 0 0 2px #c9a9d8; }
  .attack .pic svg { height: 11px; width: auto; }
  .lv-foot { padding: 0 16px 16px; }
  .grade { font-family: var(--pixel); font-size: 9px; color: var(--muted); }

  /* step 3: world 1 + download */
  .world-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 34px; align-items: start; }
  .cover { background: var(--panel); color: var(--ink); }
  .cover .scene { height: 240px; }
  .cover-body { padding: 20px 22px; border-top: 4px solid var(--ink); display: grid; gap: 10px; }
  .cover-body p { margin: 0; color: var(--muted); }
  .inside { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
  .inside li { display: flex; gap: 12px; align-items: baseline; color: var(--soft-on-night); }
  .inside li b { font-family: var(--pixel); font-weight: 400; font-size: 10px; color: var(--gold); min-width: 4.5em; font-variant-numeric: tabular-nums; }
  .dl { margin-top: 26px; padding: 22px; background: var(--panel); color: var(--ink); display: grid; gap: 14px; }
  .dl .file { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--pixel); font-size: 10px; color: var(--muted); }
  .status { min-height: 1.4em; font-size: 16px; color: var(--muted); margin: 0; }
  .status.ok { color: #1f7a33; } .status.err { color: var(--red); }
  .tips { margin-top: 26px; display: grid; gap: 10px; color: var(--soft-on-night); font-size: 17px; }
  .tips b { font-family: var(--pixel); font-weight: 400; font-size: 10px; color: var(--gold); }
  .tips p { margin: 0; }

  /* "Lag din egen helt" form */
  .options { display: grid; gap: 26px; margin-top: 26px; }
  .custom { padding: 22px; background: var(--panel); color: var(--ink); display: grid; gap: 16px; }
  .custom p, .dl p.intro { margin: 0; color: var(--muted); font-size: 16px; }
  .custom fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .custom legend, .custom .f > span { font-family: var(--pixel); font-size: 10px; margin-bottom: 8px; display: block; padding: 0; }
  .custom .f { display: grid; }
  .custom input[type="text"] { font: inherit; font-size: 18px; padding: 10px 12px; border: 0; background: #fff; color: var(--ink);
    box-shadow: 0 0 0 3px var(--ink); min-width: 0; width: 100%; }
  .custom input[type="text"]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .swatches, .choicebar { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches label, .choicebar label { position: relative; cursor: pointer; }
  .swatches input, .choicebar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .swatches span { display: block; width: 32px; height: 32px; box-shadow: 0 0 0 3px var(--ink); }
  .swatches input:checked + span { box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--gold); }
  .choicebar span { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-family: var(--pixel); font-size: 9px; background: #fff; box-shadow: 0 0 0 3px var(--ink); }
  .choicebar span svg { height: 30px; width: auto; }
  .choicebar input:checked + span { background: var(--gold); }
  .swatches input:focus-visible + span, .choicebar input:focus-visible + span { outline: 3px solid var(--pink); outline-offset: 6px; }
  .preview { display: flex; align-items: flex-end; justify-content: center; gap: 18px; padding: 14px 12px 0; min-height: 170px;
    background: linear-gradient(#bfe6ff 0 82%, #5cc15a 82% 88%, #c9a36a 88%); box-shadow: 0 0 0 3px var(--ink); }
  .preview svg { display: block; width: auto; margin-bottom: 12px; }
  .preview .who { align-self: flex-start; font-family: var(--pixel); font-size: 11px; background: #fff; padding: 6px 8px; box-shadow: 0 0 0 3px var(--ink); max-width: 60%; overflow-wrap: anywhere; }
  .note { font-size: 15px; color: var(--muted); margin: 0; }
  .tagfree { font-family: var(--pixel); font-size: 9px; color: var(--ink); background: var(--grass); padding: 5px 7px; margin-left: 8px; vertical-align: middle; }
  @media (max-width: 520px) { .two { grid-template-columns: minmax(0, 1fr); } }
  footer { margin-top: 56px; color: var(--soft-on-night); font-size: 15px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .choice, .level, .cover, .dl, .world-hero > div { min-width: 0; }
  .scene svg { max-width: 46%; }
  h1 { overflow-wrap: anywhere; }
  .world-hero h1 { font-size: clamp(20px, 3.2vw, 34px); }
  @media (max-width: 860px) {
    .choices, .levels, .how, .world-hero { grid-template-columns: minmax(0, 1fr); }
    .scene { height: 180px; }
  }
</style>

  <main id="view"></main>

<script>
/* ---------- tiny pixel sprite renderer (same as in the booklets) ---------- */
const OUT = '#16121c';
function sprite(rows, pal, { mirror = false } = {}) {
  let g = rows.map(r => mirror ? r + [...r].reverse().join('') : r);
  const w = Math.max(...g.map(r => r.length)) + 2;
  g = ['', ...g, ''].map(r => ('.' + r).padEnd(w, '.').split(''));
  const h = g.length, filled = (y, x) => y >= 0 && y < h && x >= 0 && x < w && g[y][x] !== '.';
  const out = g.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (g[y][x] === '.' && (filled(y - 1, x) || filled(y + 1, x) || filled(y, x - 1) || filled(y, x + 1))) out[y][x] = '#';
  let rects = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w;) {
    const c = out[y][x]; if (c === '.') { x++; continue; }
    let e = x; while (e + 1 < w && out[y][e + 1] === c) e++;
    rects += `<rect x="${x}" y="${y}" width="${e - x + 1}" height="1" fill="${c === '#' || c === 'K' ? OUT : pal[c]}"/>`;
    x = e + 1;
  }
  return (h2, label = '') => `<svg viewBox="0 0 ${w} ${h}" style="height:${h2}" shape-rendering="crispEdges" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

const HERO = sprite(["....H.H.", "...HHHHH", "..HHHHHH", ".HHHhHHH", ".BBBBBBB", ".HSSSSSS", ".HSWbSSS", ".HSWbSSS", "sSSSSSSS", ".SSSSSSK",
  "..sSSSSS", "..TTTTTT", ".TTTTTTY", ".TtTTTYY", ".StTTTTY", ".SLLLLLL", "..PPPPPP", "...PPP..", "..OOOO.."],
  { H:'#7a4520', h:'#4a2a12', B:'#ff7a1a', S:'#f5c996', s:'#dd9f68', W:'#ffffff', b:'#1a78c2', T:'#1fa8a0', t:'#13716c', Y:'#ffd23f', L:'#5a3418', P:'#3a4a8a', O:'#5a3418' }, { mirror: true });
const LAVA = sprite(["H............", "HH...........", "hHH.........F", ".hHH.......FY", "..hHH..rrrrrr", "...hHrrrrrrrr", ".F..rrrrrrrrr", "FYF.rrKKrrrrr",
  "FYFrrrrEKKrrr", "rrrrrrEEEEKrr", "rRrrKrEEKKEOr", "rRrRKrEEKKEOr", "rRrRKrrEEErOr", "rRrrKrKKKKKKK", "rrrrKKWWMWWMW", "RrrrKKMWMMWMM", "rrrrKKMMMMMMM",
  "rrrr.KMMWMMMW", "WKWKWKMWWMMWW", "W.W.WrKKKKKKK", "....rrOrrrrOr", "....rrrOOrrrO", "....rrrrrrrrr", "....RRRR.....", "...RRRRR....."],
  { r:'#a8301f', R:'#6c160f', O:'#ff9a1f', Y:'#ffe14a', F:'#ff5a14', H:'#f3e3b6', h:'#b89c63', E:'#ffe14a', W:'#ffffff', M:'#3a0a0a' }, { mirror: true });
const PRINCESS = sprite(["....c..c", "....cccj", "...HHHHH", "..HHHHHH", ".HHHHHHH", ".HHHSSSS", ".HSWESSS", ".HSEESSS", "HHpSSSSS", "HHSSSSSK",
  "HH.sSSSS", "HH.dDDDD", "HHddDDDj", "H.SDDDDD", "..SDDDDD", "..DDdDDD", ".DDDdDDD", ".DDdDDDD", "DDDdDDDD", "LLLLLLLL", "....jj.."],
  { c:'#ffd23f', j:'#ff3d8b', H:'#b5552c', S:'#f8d2ae', s:'#e3a882', W:'#ffffff', E:'#2a1a3a', p:'#ff9cc4', D:'#ff8fc2', d:'#e0609e', L:'#ffffff' }, { mirror: true });
const BUNNY = sprite(["...ww....", "..wppw...", "..wppw...", "..wppw...", "..wppw...", "...ww....", "..wwwwwww", ".wwwwwwww", "wwwwwwwww", "wwWEEwwww",
  "wwEEEwwww", "wwEEEwwww", "wppwwwwwn", "wwwwwwwKw", ".wwwwwwwK", "..wwwwwww", "...cwwbbb", "..wcwwbbb", "...cwwbbb", "..www...."],
  { w:'#f4eefa', c:'#d9cde8', p:'#ffb3d1', n:'#ff6fa8', b:'#ffffff', E:'#2a1a3a', W:'#ffffff' }, { mirror: true });
const FOX = sprite(["o........", "oo.......", "oco......", "occo.....", "occoooooo", "ooooooooo", "ooWEEoooo", "ooEEEoooo", "owEEEoooo",
  "wwwpwwwwK", ".wwwwwwKw", "..wwwwwwK", "...oowwww", "...oowwww", "..ooowwww", "...KK...."],
  { o:'#ff8a3d', c:'#ffe2b8', w:'#ffffff', p:'#ffb3d1', E:'#2a1a3a', W:'#ffffff' }, { mirror: true });
const HEART = sprite([".RRR...RRR.", "RWWRR.RRRRR", "RWRRRRRRRRD", "RRRRRRRRRRD", ".RRRRRRRRD.", "..RRRRRRD..", "...RRRRD...", "....RRD....", ".....D....."],
  { R:'#ff6fb0', W:'#ffffff', D:'#e0408a' });
const MINI = sprite([".RRR...RRR.", "RRRRR.RRRRR", "RRRRRRRRRRR", "RRRRRRRRRRR", ".RRRRRRRRR.", "..RRRRRRR..", "...RRRRR...", "....RRR....", ".....R....."], { R:'#ff6fb0' });
const PIZZA = sprite([".ccc.", "cyryc", "cyyyc", "cryrc", ".ccc."], { c:'#e8a54b', y:'#ffd23f', r:'#d63a2a' });
const HALFPIZZA = sprite([".cc", "cyr", "cyy", "cry", ".cc"], { c:'#e8a54b', y:'#ffd23f', r:'#d63a2a' });

/* ---------- content ---------- */
const ADVENTURES = {
  monsterkamp: {
    title: 'Monsterkamp', hook: 'Kamp mot monstre',
    text: 'Prinsesse Nogi er stjålet av det slemme monsteret Blodio. Helten må slå monstrene med matte. Hvert riktig svar tar ett liv fra monsteret.',
    tags: ['5 KAMPER', 'LIVMÅLER', 'SLUTTBOSS', 'LES SELV-LINJER'],
    scene: () => `${HERO('120px', 'Helten')}<span class="vs">VS</span>${LAVA('150px', 'Lavamonsteret')}`,
    color: '#e0452a', defHero: 'Max', defFigur: 'helt', defClothes: '1fa8a0',
    worlds: [['Monsterskogen', 'Verden 1'], ['Klosseverdenen', 'Verden 2'], ['Skyggefjellet', 'Verden 3']],
    world1: { name: 'Monsterskogen', intro: 'Blodio har tatt Nogi med til slottet sitt. Fem monstre vokter veien gjennom Monsterskogen: Lavamonsteret, Ismonsteret, Robotmonsteret, Dragemonsteret og Skyggekongen. Til slutt venter Blodio selv, med ti liv.',
      inside: [['Side 1', 'Historien, med korte linjer barnet kan lese selv'], ['Side 2', 'Kartet over Monsterskogen'], ['Side 3–7', 'Fem kamper med livmåler og seks angrep'], ['Side 8', 'Sluttkamp mot Blodio: 10 liv, 11 angrep'], ['Side 9', 'Fasit for voksne']] },
    extras: [['venn', 'Prinsessen som skal reddes', 'Nogi'], ['skurk', 'Skurken', 'Blodio']],
  },
  dyreredning: {
    title: 'Dyreredning', hook: 'Redd søte dyr',
    text: 'Kaninen Pip får et brev fra kusinen Tokki i Sør-Korea: alle kjæledyrene hennes er borte. Prinsesse Mira reiser dit og redder dem med matte, for matte er likt på alle språk.',

const shade = (c, f) => { const n = parseInt(c, 16), ch = s => Math.round(((n >> s) & 255) * f).toString(16).padStart(2, '0'); return '#' + ch(16) + ch(8) + ch(0); };

async function download(file, nice) {
  const status = document.getElementById('status');
  const say = (t, cls = '') => { status.textContent = t; status.className = 'status ' + cls; };
  say('Henter heftet …');
  try {
    if (!window.claude) {             // an ordinary website (GitHub Pages): a plain download link works
      const a = document.createElement('a');
      a.href = 'pdf/' + file; a.download = nice; document.body.appendChild(a); a.click(); a.remove();
      say('Nedlastingen starter. Åpne PDF-en og skriv ut på A4 i farger.', 'ok'); return;
    }
    const dl = await window.claude.use('downloads');
    if (!dl) { say('Nedlasting virker ikke i denne visningen. Åpne lenken i en vanlig nettleser og prøv igjen.', 'err'); return; }
    const res = await fetch('pdf/' + file);
    if (!res.ok) throw { code: 'missing' };
    await dl.save({ filename: nice, data: await res.blob() });
    say('Lagret! Åpne PDF-en og skriv ut på A4 i farger.', 'ok');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') say('Nedlastingen ble avbrutt. Trykk på knappen igjen når du er klar.');
    else if (code === 'rate_limited') say('Et lagringsvindu er allerede åpent. Fullfør det først.');
    else say('Noe gikk galt med nedlastingen. Last siden på nytt og prøv igjen.', 'err');
  }
}

/* ---------- routing with bare #tokens ---------- */
function render() {
  const h = location.hash.slice(1);
  const m = h.match(/^(monsterkamp|dyreredning)(?:-(\d))?$/);
  if (m && m[2] && +m[2] >= 1 && +m[2] <= 3) world(m[1], +m[2]);
  else if (m) adventure(m[1]);
  else home();
  window.scrollTo(0, 0);
}
function go(token) {
  if (location.hash.slice(1) === token) render();
  else location.hash = token;
}
window.addEventListener('hashchange', render);
